name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: read

jobs:
  # Builds each development environment, on PRs (stackptr/ops's "Require CI"
  # requires both) and on main. No secrets: nothing pushes to a cache.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build development environment
      env:
        SYSTEM: ${{ matrix.system }}
      run: nix develop --system "$SYSTEM" --command true
